# cv_agent default configuration
# All values can be overridden via CLI flags or environment variables.

model_variant: yolo26n
epochs_per_round: 3 # demo default for COCO128 smoke runs; raise for real training
max_rounds: 7
interaction_mode: ask # auto | ask
auto_prompt_seconds: 10 # Auto mode: countdown before next round (A=Ask, Q=Quit)

# Set a class name to prioritize its mAP@0.5 in the reward function (3x weight)
optimize_for_class: null # e.g., "vehicle", "person"

data:
  data_yaml: coco128.yaml # demo dataset; override via --data-yaml for real datasets
  min_images: 50 # COCO128-friendly; raise for real datasets (e.g. 100+)
  min_ann_per_class: 1 # COCO128-friendly; raise for real training (e.g. 50+)
  min_pixel_area: 64
  validate_brightness: true
  validate_angles: true

initial_hyperparams:
  lr0: 0.01
  lrf: 0.01
  batch: 16
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  box: 7.5
  cls: 0.5
  dfl: 1.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5

optuna:
  n_trials: 50 # max Optuna ask() calls per run; after budget, proposals fall back
  search_strategy: bayesian # legacy: non-bayesian values map to YELLOW escape strategy
  yellow_strategy: random_walk # random_walk | simulated_annealing | bayesian
  n_startup_trials: 10
  pruner: median # median | hyperband | none
  search_space:
    lr0: [0.001, 0.1]
    lrf: [0.001, 0.1]
    batch: [4, 8, 16, 32]
    momentum: [0.8, 0.98]
    weight_decay: [0.0, 0.001]
    mosaic: [0.0, 1.0]
    mixup: [0.0, 0.5]
    copy_paste: [0.0, 0.3]
    hsv_h: [0.0, 0.05]
    hsv_s: [0.0, 1.0]
    hsv_v: [0.0, 1.0]
    degrees: [0.0, 30.0]
    translate: [0.0, 0.2]
    scale: [0.1, 0.9]
    shear: [0.0, 10.0]
    perspective: [0.0, 0.001]
    flipud: [0.0, 0.5]
    fliplr: [0.0, 1.0]

llm:
  # ⚠️  NEVER commit a real API key here — this file is tracked and pushed to GitHub.
  #     Two safe ways to provide the key:
  #       1. Environment variable (recommended): export CV_AGENT_LLM_KEY="sk-..."
  #       2. Local override file: create cv_agent.local.yaml (git-ignored) with:
  #            llm:
  #              api_key: "sk-your-real-key"
  #     A pre-commit hook also scans for leaked keys as a backstop.
  api_base: https://api.deepseek.com
  api_key: "" # Leave empty — reads from CV_AGENT_LLM_KEY or DEEPSEEK_API_KEY env vars
  model: deepseek-v4-flash
  max_tokens: 4096
  temperature: 0.3
  max_calls_per_session: 20

mlflow_uri: http://localhost:5000
experiment_name: cv_agent
output_root: runs

checkpoints:
  top_n: 5
  auto_save_top: true
  manual_save_dir: manual

decision:
  green_threshold_pct: 3.0
  red_threshold_pct: -5.0
  red_escalation_count: 3
  yellow_resets_red_count: true
