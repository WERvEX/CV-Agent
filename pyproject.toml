[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv_agent"
version = "0.1.0"
description = "Automated closed-loop YOLO training CLI with Optuna hyperparameter optimization and LLM-based strategic reasoning"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "cv_agent contributors"}
]
dependencies = [
    "ultralytics>=8.3.0",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "mlflow>=2.12.0",
    "optuna>=3.6.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "openai>=1.30.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "diff-match-patch>=20230430",
    "torch>=2.2.0",
    "opencv-python>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
cv_agent = "cv_agent.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"